<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Termux Bot UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg text-center w-96 border border-gray-700">
        <h1 class="text-2xl font-bold text-blue-400 mb-4">Bot Control Panel</h1>
        <p class="text-gray-400 mb-6 text-sm">Termux ပေါ်တွင် Run ထားသော Website ဖြစ်ပါသည်။</p>
        
        <div class="space-y-4">
            <button class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded w-full transition duration-300">
                စတင် စစ်ဆေးမည်
            </button>
            <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded w-full transition duration-300">
                ရပ်တန့်မည်
            </button>
        </div>
    </div>
</body>
</html>
