<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Link Code Hack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-2xl text-center w-96 border border-gray-700">
        <div class="flex justify-center mb-4">
            <div class="bg-blue-500 p-3 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
        </div>
        
        <h1 class="text-2xl font-bold text-blue-400 mb-2">Voucher Auto Checker</h1>
        <p class="text-gray-400 mb-6 text-sm">Termux Server &bull; Port 5000</p>
        
        <div id="status-box" class="bg-gray-900 border border-gray-600 rounded p-3 mb-6 text-sm text-yellow-400 hidden">
            <!-- Status message များကို ဤနေရာတွင် ပြမည် -->
        </div>

        <div class="space-y-4">
            <button onclick="startBot()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded w-full transition duration-300 shadow-lg">
                ▶ စတင် စစ်ဆေးမည်
            </button>
            <button onclick="stopBot()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded w-full transition duration-300 shadow-lg">
                ■ ရပ်တန့်မည်
            </button>
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('status-box');

        function showStatus(message, isError = false) {
            statusBox.style.display = 'block';
            statusBox.className = `bg-gray-900 border rounded p-3 mb-6 text-sm ${isError ? 'text-red-400 border-red-500' : 'text-green-400 border-green-500'}`;
            statusBox.innerText = message;
        }

        function startBot() {
            fetch('/start', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    showStatus(data.message, data.status === 'error');
                });
        }

        function stopBot() {
            fetch('/stop', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    showStatus(data.message);
                });
        }
    </script>
</body>
</html>
