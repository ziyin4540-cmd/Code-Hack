<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Code Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md border border-gray-700">
        <h1 class="text-2xl font-bold text-blue-400 mb-6 text-center">Universal Checker</h1>
        
        <div id="status-box" class="hidden bg-gray-900 border rounded p-3 mb-4 text-sm"></div>

        <div class="space-y-4 mb-6 text-gray-300 text-sm">
            <!-- Target URL Input -->
            <div>
                <label class="block mb-1">Target URL (API)</label>
                <input type="text" id="targetUrl" placeholder="https://api.com/check?code=" class="w-full p-2 bg-gray-900 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="flex gap-4">
                <!-- Digit Length Input -->
                <div class="w-1/2">
                    <label class="block mb-1">Code Length (ဥပမာ - ၆, ၈)</label>
                    <input type="number" id="codeLength" value="8" class="w-full p-2 bg-gray-900 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
                </div>
                <!-- Code Type Selection -->
                <div class="w-1/2">
                    <label class="block mb-1">Code အမျိုးအစား</label>
                    <select id="codeType" class="w-full p-2 bg-gray-900 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
                        <option value="mixed">စာ + ဂဏန်း</option>
                        <option value="digits">ဂဏန်း သီးသန့်</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="space-y-4">
            <button onclick="startBot()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded w-full transition duration-300 shadow-lg">
                ▶ စတင် စစ်ဆေးမည်
            </button>
            <button onclick="stopBot()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded w-full transition duration-300 shadow-lg">
                ■ ရပ်တန့်မည်
            </button>
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('status-box');

        function showStatus(message, isError = false) {
            statusBox.style.display = 'block';
            statusBox.className = `bg-gray-900 border rounded p-3 mb-6 text-sm ${isError ? 'text-red-400 border-red-500' : 'text-green-400 border-green-500'}`;
            statusBox.innerText = message;
        }

        function startBot() {
            const url = document.getElementById('targetUrl').value;
            const length = document.getElementById('codeLength').value;
            const type = document.getElementById('codeType').value;

            fetch('/start', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target_url: url, code_length: length, code_type: type })
            })
            .then(res => res.json())
            .then(data => showStatus(data.message, data.status === 'error'));
        }

        function stopBot() {
            fetch('/stop', { method: 'POST' })
                .then(res => res.json())
                .then(data => showStatus(data.message));
        }
    </script>
</body>
</html>
